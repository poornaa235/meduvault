<!DOCTYPE html>
<html>
<head>
    <title>Success</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .success-box {
            margin: 100px auto;
            padding: 30px;
            max-width: 500px;
            background-color: #e6ffe6;
            border: 2px solid #00cc66;
            border-radius: 10px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .success-box h2 {
            color: #009933;
        }
        .success-box a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #009933;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .success-box a:hover {
            background-color: #007a29;
        }
    </style>
</head>
<body>
    <div class="success-box">
        <h2>{{ message }}</h2>
        <a href="/">Return to Home</a>
    </div>
</body>
</html>
