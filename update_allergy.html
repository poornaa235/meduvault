<!DOCTYPE html>
<html>
<head>
    <title>Update Allergy Info</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Update Allergy Info</h2>

        </form>
    </div>
</body>
</html>
