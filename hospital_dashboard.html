<!DOCTYPE html>
<html>
<head>
    <title>Hospital Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Hospital Dashboard</h2>
        <form method="POST" action="/hospital_action">
            <label for="aadhar">Enter Patient Aadhar Number:</label><br>
            <input type="text" name="aadhar" required><br><br>

            <button type="submit" name="action" value="view">View Data</button>
            <button type="submit" name="action" value="update_medical">Update Medical History</button>
            <button type="submit" name="action" value="update_allergy">Update Allergy Info</button>
            <button type="submit" name="action" value="view_personal">View Personal Details</button>
        </form>
    </div>
</body>
</html>
