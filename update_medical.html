<!DOCTYPE html>
<html>
<head>
    <title>Update Medical History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Update Medical History</h2>
        <form method="POST">
            <input type="text" name="aadhar" placeholder="Aadhar Number" required><br><br>
            <input type="text" name="diagnosis" placeholder="Diagnosis" required><br><br>
            <input type="text" name="treatment" placeholder="Treatment" required><br><br>
            <input type="date" name="date" required><br><br>
            <button type="submit">Update</button>
        </form>
    </div>
</body>
</html>
